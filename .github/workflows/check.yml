name: Check watchdog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test tests/scripts/watchdog.test.ts
